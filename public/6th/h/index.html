<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6th Grade Greek History Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            font-size: 16px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .selector-container {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .video-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 10px;
        }

        iframe {
            width: 100%;
            height: 360px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .video-info {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .video-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .video-description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .no-video {
            text-align: center;
            padding: 40px;
            background: #f8f9fa;
            border-radius: 10px;
            color: #999;
            font-style: italic;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }

        .greek-flag {
            display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇬🇷 6th Grade Greek History Videos</h1>
        <div class="subtitle">Ιστορία ΣΤ' Δημοτικού - Εκπαιδευτικά Βίντεο</div>
        
        <div class="selector-container">
            <label for="videoSelect">📺 Select a video / Επιλέξτε βίντεο:</label>
            <select id="videoSelect" onchange="changeVideo()">
                <option value="">-- Choose a video / Επιλέξτε βίντεο --</option>
                <option value="6th-86-89">6η Δημοτικού - ΕΝΟΤΗΤΑ Γ - ΚΕΦΑΛΑΙΟ 4 - σσ. 86-89</option>
                <option value="6th-90-93">6η Δημοτικού - ΕΝΟΤΗΤΑ Γ - ΚΕΦΑΛΑΙΟ 5 - σσ. 90-93</option>
            </select>
        </div>

        <div class="video-container">
            <!-- YouTube iframe player -->
            <iframe 
                id="videoPlayer"
                width="640" 
                height="360" 
                src="" 
                frameborder="0" 
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
            
            <div id="videoInfo" class="video-info" style="display: none;">
                <div id="videoTitle" class="video-title"></div>
                <div id="videoDescription" class="video-description"></div>
            </div>

            <div id="noVideoMessage" class="no-video" style="display: block;">
                👆 Select a video from the dropdown above to start watching
            </div>
        </div>

        <div class="footer">
            <span class="greek-flag">🏛️</span> Educational content for 6th grade Greek history
        </div>
    </div>

    <script>
        const videoData = {
            '6th-86-89': {
                title: 'Η ΑΠΟΤΙΝΑΞΗ ΤΟΥ ΟΘΩΜΑΝΙΚΟΥ ΖΥΓΟΥ',
                description: 'Η ΕΠΑΝΑΣΤΑΣΗ ΣΤΗ ΣΤΕΡΕΑ ΕΛΛΑΔΑ',
                videoId: 'OwUUK9PMmto'
            },
            '6th-90-93': {
                title: 'Η ΑΠΟΤΙΝΑΞΗ ΤΟΥ ΟΘΩΜΑΝΙΚΟΥ ΖΥΓΟΥ',
                description: 'Η ΕΠΑΝΑΣΤΑΣΗ ΣΤΑ ΝΗΣΙΑ ΤΟΥ ΑΙΓΑΙΟΥ',
                videoId: 'pF_zHJ4BEEs' // Replace with actual YouTube ID for 90-93
            }
        };

        function changeVideo() {
            const select = document.getElementById('videoSelect');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoInfo = document.getElementById('videoInfo');
            const noVideoMessage = document.getElementById('noVideoMessage');
            const videoTitle = document.getElementById('videoTitle');
            const videoDescription = document.getElementById('videoDescription');
            
            const selectedValue = select.value;
            
            if (selectedValue && videoData[selectedValue]) {
                // Update YouTube iframe source using youtube-nocookie.com for better privacy
                videoPlayer.src = 'https://www.youtube-nocookie.com/embed/' + videoData[selectedValue].videoId;
                
                // Update info
                videoTitle.textContent = videoData[selectedValue].title;
                videoDescription.textContent = videoData[selectedValue].description;
                
                // Show video info, hide no video message
                videoInfo.style.display = 'block';
                noVideoMessage.style.display = 'none';
            } else {
                // Clear iframe
                videoPlayer.src = '';
                
                // Hide video info, show no video message
                videoInfo.style.display = 'none';
                noVideoMessage.style.display = 'block';
            }
        }

        // Add keyboard shortcut (Escape) to stop video
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = '';
            }
        });
    </script>
</body>
</html>
